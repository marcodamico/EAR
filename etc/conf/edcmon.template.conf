########### EDCMON section
# sensor_list field must be placed at the end. It is a comma separated list of sensors names. 
# Use quotes "" to group sensors lists or sensor names includig spaces
# host can be any or a hostname 
# pdu_type can be : storage, management, network, ads_chiller, two_phase or others
#
# Cooling devices (ads_chiller, two_phase) are read through Modbus TCP by the cooling_monitor
# EDCMON plugin, running on the node given in host=. pdu_ips is the device ip[:port] (port 502
# by default). sensor_list maps register names to register addresses, either fully
# (NAME:reg,NAME:reg,...) or as a starting address followed by consecutive registers
# (NAME:reg,NAME,NAME,...). If omitted, the default register order is used (see
# src/metrics/ads_chiller/ads_chiller.h and src/metrics/two_phase/two_phase.h).
# EARGMID is the EARGM providing the IT power associated with the device, used when
# cooling_monitor.so is built with SINGLE_NODE=0.
#
edcmontag=stg pdu_type=storage pdu_ips=pduip1,pduip2,pduip3 sensor_list="Internal Humidity,Internal Temperature,Total Real Power"
edcmontag=ntw pdu_type=network pdu_ips=pduip4 sensor_list="Internal Humidity,Internal Temperature,Total Real Power"
edcmontag=mgt pdu_type=management pdu_ips=pdu5 sensor_list="Power"
edcmontag=spe host=host1 pdu_type=others pdu_ips=pdu6 sensor_list=Power
edcmontag=chiller1 host=host2 pdu_type=ads_chiller pdu_ips=192.168.1.10:502 EARGMID=1 sensor_list=IN_TEMP_HT:0,OUT_TEMP_HT,IN_TEMP_MT,OUT_TEMP_MT,IN_TEMP_LT,OUT_TEMP_LT
